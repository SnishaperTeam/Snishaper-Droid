# JVM 参数：Gradle daemon 与 Kotlin/AGP 编译进程共用。
# -Xmx3g 足以构建本工程；如 CI 内存更小可调低。
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g

# 并行与缓存（多模块后收益明显；当前单模块也无害）。
org.gradle.parallel=true
org.gradle.caching=true

# AGP 要求（AndroidX 工程必须为 true）。
android.useAndroidX=true

# Kotlin 官方推荐的默认风格。
kotlin.code.style=official
org.gradle.java.home=D\:/Jetbrains IDES/Android Studio/jbr

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
