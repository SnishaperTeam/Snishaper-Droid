# ---------------------------------------------------------------------------
# Gradle 全局配置（Snishaper-Droid）
#
# 环境事实见 docs/analysis/env-report.md：
#   - 本机默认 java 为 Oracle JDK 27；Android Studio 自带 jbr 25.0.3。
#   - AGP 9.4.1 / Gradle 9.7.1 已用 jbr 25 做全量构建验证（BUILD SUCCESSFUL）。
#   - Gradle wrapper 固定 9.7.1（本机 wrapper dists 缓存已有该发行版）。
# ---------------------------------------------------------------------------

# JVM 参数：Gradle daemon 与 Kotlin/AGP 编译进程共用。
# -Xmx3g 足以构建本工程；如 CI 内存更小可调低。
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g

# 并行与缓存（多模块后收益明显；当前单模块也无害）。
org.gradle.parallel=true
org.gradle.caching=true

# AGP 要求（Compose/AndroidX 工程必须为 true）。
android.useAndroidX=true

# Kotlin 官方推荐的默认风格。
kotlin.code.style=official

# ---------------------------------------------------------------------------
# JDK 选择：本地固定使用 Android Studio 自带 jbr（JDK 25.0.3）。
#
# 注意：
#   * gradle.properties 里的 org.gradle.java.home 是“本机路径”，在 CI（Linux）
#     上不存在。CI workflow 必须用命令行覆盖（命令行 -D 优先级高于本文件）：
#         ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" lint test assembleRelease
#     或先删除/注释本行（见 .github/workflows/android.yml 的说明）。
#   * 如果不想写死路径，可删除本行，改由 scripts/dev-env.ps1 设置 JAVA_HOME
#     （dev-env 会把 JAVA_HOME 指向同一个 jbr）；CI 则用 setup-java 的版本。
# ---------------------------------------------------------------------------
org.gradle.java.home=D\:/Jetbrains IDES/Android Studio/jbr

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
