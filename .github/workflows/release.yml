# =============================================================================
# Snishaper-Droid · Release
#
# 触发：push tag `v*`（与桌面 SniShaper 的版本节奏对齐，形如 v1.29.0 /
#       v1.29.0-beta.1），或手动触发。
# 流程：与 android.yml 相同的工具链准备（runner 预装 SDK + sdkmanager 直装、
#       官方 Maven/Gradle 源、gomobile bind → AAR 校验）→ lint/test →
#       assembleRelease + bundleRelease → 生成 changelog / release notes →
#       GitHub Release（APK + AAB，release notes 明确标注“已移除 CA 功能”）。
# =============================================================================
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "手动演练用 tag（如 v1.29.0）"
        required: false

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org
  COMPILE_SDK: "37"
  COMPILE_SDK_MINOR: "2"
  BUILD_TOOLS: "37.0.0"
  NDK_VERSION: "30.0.16248370"
  GOMOBILE_VERSION: "v0.0.0-20260803200217-62cee1672c8e"
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # changelog needs the full tag/commit history

      # ----- JDK -------------------------------------------------------------
      - name: Setup JDK 17 (requirement alignment; not used for the build)
        id: jdk17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup JDK 25 (actual build JDK)
        id: jdk25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Use JDK 25 as JAVA_HOME
        run: echo "JAVA_HOME=${{ steps.jdk25.outputs.java-home }}" >> "$GITHUB_ENV"

      # ----- Caches ----------------------------------------------------------
      - name: Setup Gradle (dependency + build cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Android SDK components (NDK / platform / build-tools)
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
            ${{ env.ANDROID_SDK_ROOT }}/platforms/android-${{ env.COMPILE_SDK }}.${{ env.COMPILE_SDK_MINOR }}
            ${{ env.ANDROID_SDK_ROOT }}/build-tools/${{ env.BUILD_TOOLS }}
          key: android-sdk-${{ runner.os }}-api${{ env.COMPILE_SDK }}.${{ env.COMPILE_SDK_MINOR }}-bt${{ env.BUILD_TOOLS }}-ndk${{ env.NDK_VERSION }}
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: Cache gomobile toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/go/bin/gomobile
            ~/go/bin/gobind
          key: gomobile-${{ runner.os }}-${{ env.GOMOBILE_VERSION }}
          restore-keys: |
            gomobile-${{ runner.os }}-

      - name: Cache Go build cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('gomobile/go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-

      # ----- Android SDK / NDK ----------------------------------------------
      - name: Install Android SDK components (preinstalled SDK on the runner)
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"

          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)" || {
              echo "::error::sdkmanager not found on the runner"; exit 1;
            }
          fi

          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-${COMPILE_SDK}.${COMPILE_SDK_MINOR}" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}"

          echo "ANDROID_NDK_HOME=${SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      # ----- Go / gomobile ---------------------------------------------------
      - name: Setup Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: gomobile/go.sum

      - name: Check gcc (cgo toolchain)
        run: gcc --version

      - name: Install gomobile + gobind (pinned version)
        run: |
          set -euo pipefail
          go install "golang.org/x/mobile/cmd/gomobile@${GOMOBILE_VERSION}"
          go install "golang.org/x/mobile/cmd/gobind@${GOMOBILE_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # ----- CI uses the official registries (runner is outside China) -------
      - name: Use official Maven / Gradle repositories in CI
        run: |
          set -euo pipefail
          sed -i '/repo\.huaweicloud\.com/d' settings.gradle.kts
          sed -i 's#repo\.huaweicloud\.com/gradle#services.gradle.org/distributions#g' \
            gradle/wrapper/gradle-wrapper.properties

      # ----- CA-free AAR -----------------------------------------------------
      - name: Build and verify CA-free AAR
        run: |
          set -euo pipefail
          mkdir -p app/libs
          cd gomobile
          gomobile bind \
            -target=android/arm64,android/arm,android/amd64 \
            -androidapi 24 \
            -tags with_gvisor \
            -trimpath \
            -ldflags="-s -w" \
            -javapkg com.snishaper.core \
            -o ../app/libs/snishaper-core.aar \
            ./mobile
          cd ..
          python3 scripts/verify_aar.py

      # ----- Build release artifacts -----------------------------------------
      - name: Build release APK + AAB
        run: |
          set -euo pipefail
          chmod +x gradlew
          sed -i '/^org\.gradle\.java\.home=/d' gradle.properties
          ./gradlew --no-daemon --stacktrace lint test assembleRelease bundleRelease

      # ----- Version / changelog --------------------------------------------
      - name: Resolve version from tag
        id: version
        run: |
          set -euo pipefail
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        run: |
          set -euo pipefail
          PREV_TAG="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          {
            echo "## 变更 / Changelog（${VERSION}）"
            echo ""
            if [ -n "${PREV_TAG}" ]; then
              git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD" | head -200
            else
              git log --pretty=format:"- %s (%h)" -n 50
            fi
          } > CHANGELOG.RELEASE.md

      - name: Compose release notes
        run: |
          set -euo pipefail
          {
            echo "# Snishaper-Droid ${VERSION}（Android）"
            echo ""
            echo "> ⚠ **已移除 CA 功能**：Android 版不包含证书生成、MITM 拦截、"
            echo "> 系统证书安装/信任库写入等能力；规则仅支持 TLS-RF / Transparent，"
            echo "> 导入桌面配置时会自动清洗 mitm/quic 规则。"
            echo ""
            echo "- 构建：Gradle 9.8.0 / AGP 9.4.1 / JDK 25 / compileSdk 36 / minSdk 24"
            echo "- 内核：snishaper-core v0.4.0（gomobile AAR，arm64-v8a + armeabi-v7a + x86_64）"
            echo "- 产物：release APK、AAB（见下方 Assets）"
            echo ""
            cat CHANGELOG.RELEASE.md
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      # ----- Publish ---------------------------------------------------------
      - name: Upload APK/AAB artifacts (run retention)
        uses: actions/upload-artifact@v4
        with:
          name: snishaper-droid-release-${{ env.VERSION }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/libs/snishaper-core.aar
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Snishaper-Droid ${{ env.VERSION }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
