# =============================================================================
# Snishaper-Droid · Release
#
# 手动触发（workflow_dispatch），需要确认两件事，均由 github-actions bot
# 自动提交推送：
#   1. 主版本号（version）：提交到软件内标注版本的所有位置 ——
#        gradle  app/build.gradle.kts            versionName
#        后端    gomobile/mobile/app.go          engineVersion
#        前端    frontend-android/package.json   version（含 package-lock 同步）
#      留空则沿用当前版本，不产生提交。
#   2. 发布渠道（channel）：同样由 bot 提交到 gomobile/mobile/app.go 的
#      releaseChannel 常量（release 渠道写入 "stable"）。
#
# 版本策略（单一来源：app/build.gradle.kts 的 versionName）：
#   * 正式渠道（release）：tag = v{version}
#   * 预发布渠道：tag = v{version}-{suffix}（如 v1.30.0-alpha.1），后缀留空时
#     默认 {channel}.1；构建时把 APK versionName 改写为带后缀的完整版本，
#     保证应用内"关于"页与 GitHub Release 版本一致。
#   * versionCode 由 versionName 推导（major*1_000_000 + minor*1_000 + patch），
#     bot 只提交 versionName，versionCode 自动单调递增。
#
# 更新日志：不做 AI 总结，直接列提交：
#   - <提交标题> by @<作者> in `<完整 sha>`（反引号包裹，GitHub 自动链接）
# =============================================================================
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "主版本号（如 1.30.0）。bot 自动提交到 gradle / 后端 / 前端；留空沿用当前版本"
        required: false
        type: string
        default: ""
      channel:
        description: "发布渠道（bot 同步提交到后端 releaseChannel）"
        required: true
        type: choice
        default: "release"
        options:
          - release
          - rc
          - beta
          - alpha
      version_suffix:
        description: "预发布后缀（如 alpha.2）；非 release 渠道留空时默认 {channel}.1"
        required: false
        type: string
        default: ""

permissions:
  contents: write

# 串行发布：防止两次 dispatch 的 bot 提交互相冲突。
concurrency:
  group: release
  cancel-in-progress: false

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org
  COMPILE_SDK: "37"
  COMPILE_SDK_MINOR: "2"
  BUILD_TOOLS: "37.0.0"
  NDK_VERSION: "30.0.16248370"
  GOMOBILE_VERSION: "v0.0.0-20260803200217-62cee1672c8e"
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  # ------------------------------------------------------------------
  # Bot commit: version (gradle / backend / frontend) + channel, then
  # resolve the final tag and skip if the release already exists.
  # ------------------------------------------------------------------
  bump:
    name: Bump version & channel (bot)
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      skip: ${{ steps.resolve.outputs.skip }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node (syncs package-lock on version bump)
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Commit version & channel (github-actions[bot])
        id: bump
        env:
          INPUT_VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          base="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)"
          if [ -z "$base" ]; then
            echo "::error::versionName not found in app/build.gradle.kts"
            exit 1
          fi

          version="$base"
          if [ -n "$INPUT_VERSION" ]; then
            if ! printf '%s' "$INPUT_VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$'; then
              echo "::error::invalid version '${INPUT_VERSION}' (expected e.g. 1.30.0)"
              exit 1
            fi
            version="$INPUT_VERSION"
          fi

          # Channel shown in the app: release dispatches display as "stable".
          display_channel="$CHANNEL"
          if [ "$CHANNEL" = "release" ]; then
            display_channel="stable"
          fi

          changed=false
          if [ "$version" != "$base" ]; then
            sed -i -E "s/^([[:space:]]*versionName = )\"[^\"]*\"/\1\"${version}\"/" app/build.gradle.kts
            sed -i -E "s/^([[:space:]]*engineVersion = )\"[^\"]*\"/\1\"${version}\"/" gomobile/mobile/app.go
            sed -i -E "s/(\"version\": )\"[^\"]*\"/\1\"${version}\"/" frontend-android/package.json
            (cd frontend-android && npm install --package-lock-only --no-audit --no-fund >/dev/null)
            changed=true
          fi
          if ! grep -qE "^[[:space:]]*releaseChannel = \"${display_channel}\"$" gomobile/mobile/app.go; then
            sed -i -E "s/^([[:space:]]*releaseChannel = )\"[^\"]*\"/\1\"${display_channel}\"/" gomobile/mobile/app.go
            changed=true
          fi

          if [ "$changed" = true ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/build.gradle.kts gomobile/mobile/app.go \
              frontend-android/package.json frontend-android/package-lock.json
            git commit -m "chore(release): v${version} (${CHANNEL})"
            git push
            echo "::notice::bot committed version=${version} channel=${CHANNEL}"
          else
            echo "::notice::nothing to bump (version=${version}, channel already ${display_channel})"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Resolve tag / skip if release exists
        id: resolve
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          CHANNEL: ${{ inputs.channel }}
          SUFFIX: ${{ inputs.version_suffix }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$VERSION"
          if [ "$CHANNEL" != "release" ]; then
            version="${VERSION}-${SUFFIX:-${CHANNEL}.1}"
          fi
          tag="v${version}"
          skip=false
          if gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::notice::release ${tag} already exists - nothing to do"
            skip=true
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------
  # Full toolchain + multi-ABI release build (APK + AAB + AAR).
  # ------------------------------------------------------------------
  build:
    name: Build release artifacts
    needs: bump
    if: needs.bump.outputs.skip != 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 90

    steps:
      - name: Checkout (post-bump commit)
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.sha }}
          fetch-depth: 0

      - name: Apply prerelease version suffix (gradle versionName)
        env:
          VERSION: ${{ needs.bump.outputs.version }}
        run: |
          set -euo pipefail
          base="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)"
          if [ "$base" != "$VERSION" ]; then
            sed -i "s/^[[:space:]]*versionName = \"${base}\"/versionName = \"${VERSION}\"/" app/build.gradle.kts
            echo "::notice::versionName rewritten to ${VERSION} for this build"
          fi
          grep -n 'versionName' app/build.gradle.kts

      - name: Setup JDK 17 (requirement alignment; not used for the build)
        id: jdk17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup JDK 25 (actual build JDK)
        id: jdk25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Use JDK 25 as JAVA_HOME
        run: echo "JAVA_HOME=${{ steps.jdk25.outputs.java-home }}" >> "$GITHUB_ENV"

      - name: Setup Gradle (dependency + build cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Android SDK components (NDK / platform / build-tools)
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
            ${{ env.ANDROID_SDK_ROOT }}/platforms/android-${{ env.COMPILE_SDK }}.${{ env.COMPILE_SDK_MINOR }}
            ${{ env.ANDROID_SDK_ROOT }}/build-tools/${{ env.BUILD_TOOLS }}
          # v2 namespace: the old key's cache entry is corrupt (tar exit 2)
          key: android-sdk-v2-${{ runner.os }}-api${{ env.COMPILE_SDK }}.${{ env.COMPILE_SDK_MINOR }}-bt${{ env.BUILD_TOOLS }}-ndk${{ env.NDK_VERSION }}
          restore-keys: |
            android-sdk-v2-${{ runner.os }}-

      - name: Cache gomobile toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/go/bin/gomobile
            ~/go/bin/gobind
          key: gomobile-${{ runner.os }}-${{ env.GOMOBILE_VERSION }}
          restore-keys: |
            gomobile-${{ runner.os }}-

      - name: Cache Go build cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/go-build
          key: go-build-${{ runner.os }}-${{ hashFiles('gomobile/go.sum') }}
          restore-keys: |
            go-build-${{ runner.os }}-

      - name: Install Android SDK components (preinstalled SDK on the runner)
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"

          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)" || {
              echo "::error::sdkmanager not found on the runner"; exit 1;
            }
          fi

          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-${COMPILE_SDK}.${COMPILE_SDK_MINOR}" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}"

          echo "ANDROID_NDK_HOME=${SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Go 1.27
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache-dependency-path: gomobile/go.sum

      - name: Check gcc (cgo toolchain)
        run: gcc --version

      - name: Install gomobile + gobind (pinned version)
        run: |
          set -euo pipefail
          go install "golang.org/x/mobile/cmd/gomobile@${GOMOBILE_VERSION}"
          go install "golang.org/x/mobile/cmd/gobind@${GOMOBILE_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Use official Maven / Gradle repositories in CI
        run: |
          set -euo pipefail
          sed -i '/repo\.huaweicloud\.com/d' settings.gradle.kts
          sed -i 's#repo\.huaweicloud\.com/gradle#services.gradle.org/distributions#g' \
            gradle/wrapper/gradle-wrapper.properties

      - name: Build and verify AAR
        run: |
          set -euo pipefail
          mkdir -p app/libs
          cd gomobile
          gomobile bind \
            -target=android/arm64,android/arm,android/amd64 \
            -androidapi 24 \
            -tags with_gvisor \
            -trimpath \
            -ldflags="-s -w" \
            -javapkg com.snishaper.core \
            -o ../app/libs/snishaper-core.aar \
            ./mobile
          cd ..
          python3 scripts/verify_aar.py

      - name: Setup Node (frontend build)
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-android/package-lock.json

      - name: Build frontend bundle
        run: |
          set -euo pipefail
          cd frontend-android
          npm install --no-audit --no-fund
          npx vite build
          cd ..
          test -f app/src/main/assets/frontend/index.html

      - name: Import release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::warning::release signing secrets are incomplete - the APK/AAB will NOT be signed"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
          {
            echo "SNISHAPER_KEYSTORE=$RUNNER_TEMP/signing/release.jks"
            echo "SNISHAPER_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "SNISHAPER_KEY_ALIAS=$KEY_ALIAS"
            echo "SNISHAPER_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "::notice::release keystore imported"

      - name: Build release APK + AAB
        run: |
          set -euo pipefail
          chmod +x gradlew
          sed -i '/^org\.gradle\.java\.home=/d' gradle.properties
          ./gradlew --no-daemon --stacktrace signingInfo lint test assembleRelease bundleRelease

      - name: Verify release signature
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -name '*.apk' | head -n1)"
          test -n "$apk"
          case "$(basename "$apk")" in
            *unsigned*)
              echo "::error::release APK is unsigned (signing secrets missing or invalid)"
              exit 1
              ;;
          esac
          apksigner="$(find "${ANDROID_SDK_ROOT}/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -n1)"
          "$apksigner" verify --verbose --print-certs "$apk"
          echo "::notice::signature verified for $(basename "$apk")"

      - name: Stage release artifacts (flat layout for the publish job)
        env:
          VERSION: ${{ needs.bump.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/snishaper-droid-${VERSION}.apk"
          cp app/build/outputs/bundle/release/*.aab "dist/snishaper-droid-${VERSION}.aab"
          cp app/libs/snishaper-core.aar "dist/snishaper-core.aar"
          ( cd dist && sha256sum * > SHA256SUMS.txt )
          ls -lh dist/

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-${{ needs.bump.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------
  # Publish: commit-list changelog (no AI summary) + GitHub Release.
  # ------------------------------------------------------------------
  publish:
    name: Publish release
    needs: [bump, build]
    if: needs.bump.outputs.skip != 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.bump.outputs.sha }}
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts-${{ needs.bump.outputs.version }}
          path: release-assets

      - name: Generate commit-list changelog
        env:
          VERSION: ${{ needs.bump.outputs.version }}
          TAG: ${{ needs.bump.outputs.tag }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          PREV_TAG="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          {
            echo "# Snishaper-Droid ${VERSION}（Android）"
            echo
            echo "> 🔐 **CA 功能已恢复**：支持证书生成 / 重生成 / 导出，规则模式"
            echo "> mitm / quic / migration 与规则级 cert_verify 完整可用；系统信任库"
            echo "> 安装需要已 root 的设备（su + certutil）。"
            echo
            if [ "$CHANNEL" != "release" ]; then
              echo "> 🚧 **预发布版本（${CHANNEL}）**：仅供测试，不建议日常使用。"
              echo
            fi
            echo "## 变更 / Changelog"
            echo
            # Commit list, no AI summary:
            #   - <subject> by @<author> in `<full sha>` (backticked -> GitHub autolink)
            if [ -n "${PREV_TAG}" ]; then
              git log -n 200 --pretty=format:"- %s by @%an in \`%H\`" "${PREV_TAG}..HEAD"
            else
              git log -n 200 --pretty=format:"- %s by @%an in \`%H\`"
            fi
            echo
            echo
            echo "## 产物 / Assets"
            echo
            echo "- 界面：直接复用桌面端 React 前端（React 19 + MUI 9），与桌面版 UI 一致"
            echo "- 构建：AGP 9.5 / JDK 25 / compileSdk 37 / minSdk 24 / targetSdk 36"
            echo "- 内核：snishaper-core（gomobile AAR，arm64-v8a + armeabi-v7a + x86_64）"
            echo "- 签名：APK / AAB 使用发布密钥签名（v1 + v2 + v3 + v4），安装包 SHA-256 见 \`SHA256SUMS.txt\`"
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.bump.outputs.tag }}
          name: Snishaper-Droid ${{ needs.bump.outputs.version }}
          body_path: RELEASE_NOTES.md
          target_commitish: ${{ needs.bump.outputs.sha }}
          draft: false
          prerelease: ${{ inputs.channel != 'release' }}
          files: |
            release-assets/*.apk
            release-assets/*.aab
            release-assets/snishaper-core.aar
            release-assets/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
