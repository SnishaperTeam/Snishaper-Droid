# One-shot: publish the v1.0.0 release announcement to the SnishaperDroid
# channel. The release workflow's announcement step failed on the first v1.0.0
# run (Cloudflare 403 on the Python-urllib UA, fixed in release.yml since);
# re-dispatching release.yml skips because the v1.0.0 release already exists.
name: Announce v1.0.0 (one-shot)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  announce:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Publish the v1.0.0 release announcement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANNOUNCEMENT_ADMIN_EMAIL: ${{ secrets.ANNOUNCEMENT_ADMIN_EMAIL }}
          ANNOUNCEMENT_ADMIN_PASSWORD: ${{ secrets.ANNOUNCEMENT_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          gh release view v1.0.0 --repo "${GITHUB_REPOSITORY}" --json body --jq .body > RELEASE_NOTES.md
          python3 - <<'PY'
          import json, os, re, urllib.request
          from datetime import datetime, timezone

          base = 'https://jetcpp.ccwu.cc'
          version = '1.0.0'
          tag = 'v1.0.0'
          prerelease = False
          link = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/tag/{tag}"

          changes = ''
          try:
              notes = open('RELEASE_NOTES.md', encoding='utf-8').read()
              match = re.search(r'^## 变更 / Changelog\s*\n(.*?)(?=^## |\Z)', notes, re.S | re.M)
              if match:
                  changes = match.group(1).strip()
              if not changes:
                  changes = notes.strip()
          except OSError:
              pass
          if not changes:
              changes = f'Snishaper-Droid {version}'
          if len(changes) > 1600:
              changes = changes[:1600].rstrip() + '...'

          body = f"本次更新内容：\n{changes}\n\n完整更新日志与下载资产见本次发版页面：{link}"
          body_en = f"What's new in this release:\n{changes}\n\nFull release notes and downloadable assets: {link}"
          body_ru = f"Что нового в этом выпуске:\n{changes}\n\nПолные примечания и файлы выпуска: {link}"

          login_payload = json.dumps({
              'email': os.environ['ANNOUNCEMENT_ADMIN_EMAIL'],
              'password': os.environ['ANNOUNCEMENT_ADMIN_PASSWORD'],
          }).encode('utf-8')
          login_req = urllib.request.Request(
              f'{base}/api/admin/session', data=login_payload,
              # Cloudflare blocks the default Python-urllib UA with 403.
              headers={
                  'Content-Type': 'application/json; charset=utf-8',
                  'User-Agent': 'Mozilla/5.0 (compatible; SnishaperDroid-Release-CI/1.0)',
              }, method='POST')
          with urllib.request.urlopen(login_req, timeout=30) as response:
              login = json.load(response)
          if not login.get('admin') or not login.get('token'):
              raise RuntimeError('admin login failed')

          notice = {
              'id': f'release-{tag}',
              'title': f'Snishaper-Droid {version} 发布',
              'title_en': f'Snishaper-Droid {version} released',
              'title_ru': f'Выпущен Snishaper-Droid {version}',
              'body': body,
              'body_en': body_en,
              'body_ru': body_ru,
              'level': 'info' if prerelease else 'important',
              'published_at': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'link': link,
              'link_text': '查看本次发行说明',
              'pinned': False,
          }
          notice_payload = json.dumps(notice, ensure_ascii=False).encode('utf-8')
          notice_req = urllib.request.Request(
              f'{base}/api/notices?product=SnishaperDroid', data=notice_payload,
              headers={
                  'Content-Type': 'application/json; charset=utf-8',
                  'User-Agent': 'Mozilla/5.0 (compatible; SnishaperDroid-Release-CI/1.0)',
                  'Authorization': f"Bearer {login['token']}",
              }, method='POST')
          with urllib.request.urlopen(notice_req, timeout=30) as response:
              result = json.load(response)
          if not result.get('ok'):
              raise RuntimeError('announcement publish failed')
          print(f"::notice::announcement published for {tag} (id release-{tag}, link {link})")
          PY
